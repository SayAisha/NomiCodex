# Render.com blueprint — deploy with:  New + Blueprint + point at this repo
# (or create a Web Service manually: Docker runtime, free plan,
#  health check path /health, env var BASE_URL = your deployed site URL)
services:
  - type: web
    name: nomicodex-shot
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: BASE_URL
        # the PUBLIC site URL (with trailing slash) — shots always reflect
        # whatever is currently deployed there
        value: https://sayaisha.github.io/NomiCodex/
      - key: NODE_ENV
        value: production
