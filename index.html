<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NomiCodex — NomiFactory CEu Recipes</title>
    <link rel="stylesheet" href="app.css?v=26">
    <link rel="stylesheet" href="assets/styles/oceu.css?v=2">
    <link rel="icon" href="assets/images/favicon.png" type="image/png">
</head>
<body>
    <div id="app">
        <header class="topbar">
            <div class="logo" title="Home">
                <span class="logo-mark"></span>
                <span class="logo-name">NOMI<em>CODEX</em></span>
            </div>
            <div class="cmdbar">
                <span class="search-ico">⌕</span>
                <input id="q" placeholder="Search items, fluids, machines…" autocomplete="off" spellcheck="false">
                <kbd>/</kbd>
            </div>
            <div class="topbar-actions">
                <div class="seg" title="Pack mode">
                    <button data-mode="normal">Normal</button>
                    <button data-mode="expert">Expert</button>
                </div>
                <button class="iconbtn" id="theme" title="Toggle theme">☀</button>
                <a class="iconbtn" href="https://github.com/SayAisha/NomiCodex" target="_blank" rel="noopener" title="GitHub">⌂</a>
            </div>
        </header>
        <main class="view" id="view"></main>
    </div>

    <!-- compat mount points for the overclock calculator module -->
    <div id="nei" class="hidden" style="display:none"></div>
    <div id="panels"></div>

    <div id="splash">
        <div class="ring"></div>
        <div class="msg">Loading…</div>
    </div>

    <script type="module" src="app.js?v=26"></script>
</body>
</html>
